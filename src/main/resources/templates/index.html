<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Help Desk System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h1 class="mb-4 text-center">Help Desk — Система Тикетов</h1>

    <div class="row g-4">
        <!-- Форма создания тикета -->
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="card-title mb-0">Создать новый тикет</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/web/tickets}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Тема</label>
                            <input type="text" name="title" class="form-control" required placeholder="Например: Не работает принтер">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Описание</label>
                            <textarea name="description" class="form-control" rows="3" required placeholder="Подробное описание проблемы..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email автора</label>
                            <input type="email" name="authorEmail" class="form-control" required placeholder="user@example.com">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Отправить в Kafka</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Список тикетов -->
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h5 class="card-title mb-0">Список тикетов</h5>
                </div>
                <div class="card-body">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Тема</th>
                            <th>Автор</th>
                            <th>Статус</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="ticket : ${tickets}">
                            <td th:text="${ticket.id}">1</td>
                            <td th:text="${ticket.title}">Заголовок</td>
                            <td th:text="${ticket.authorEmail}">user@mail.com</td>
                            <td>
                                <span class="badge bg-info text-dark" th:text="${ticket.status}">NEW</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(tickets)}">
                            <td colspan="4" class="text-center text-muted py-3">Тикетов пока нет</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
