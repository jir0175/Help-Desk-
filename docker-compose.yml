version: '3.8'
services:
  postger_db:
    image: postgres:16-alpine
    container_name: helpdesc_postgres_container
    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: helpdesk_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 6770
    volumes:
      - pg_data:/var/lib/postgresql/data
volumes:
  pg_data:
